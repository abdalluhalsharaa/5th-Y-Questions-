<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MedXam Pro | Dynamic Subjects</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&family=Amiri&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
    <!-- HOME SCREEN -->
    <div id="home-screen" class="screen active">
        <div class="home-hero">
            <h1 class="bismillah">بسم الله الرحمن الرحيم</h1>
            <div class="logo-container"><div id="logo-fallback" style="font-size:3rem;">🩺</div><div id="random-quote" class="app-subtitle"></div></div>
        </div>
        <div class="nav-grid">
            <button class="nav-btn" onclick="openExams()"><div class="nav-icon-wrap"><span class="nav-icon">📚📅</span></div><span class="nav-label">Exams</span></button>
            <button class="nav-btn" onclick="openSection('wrong')"><div class="nav-icon-wrap"><span class="nav-icon">❌</span></div><span class="nav-label">Wrong Questions</span></button>
            <button class="nav-btn" onclick="openSection('favorites')"><div class="nav-icon-wrap"><span class="nav-icon">⭐</span></div><span class="nav-label">Favorite Questions</span></button>
            <button class="nav-btn" onclick="openSection('search')"><div class="nav-icon-wrap"><span class="nav-icon">🔍</span></div><span class="nav-label">Search</span></button>
            <button class="nav-btn" onclick="toggleStatistics()"><div class="nav-icon-wrap"><span class="nav-icon">📊</span></div><span class="nav-label">Statistics</span></button>
            <button class="nav-btn" onclick="toggleSettings()"><div class="nav-icon-wrap"><span class="nav-icon">⚙️</span></div><span class="nav-label">Settings</span></button>
        </div>
        <div id="statistics-panel" class="hidden-panel"><div class="panel-header"><h3>📊 Statistics</h3><button class="btn-close" onclick="toggleStatistics()">✕</button></div><div id="stats-content"></div><button class="btn-danger" onclick="resetProgress()">Reset All Progress</button></div>
        <div id="settings-panel" class="hidden-panel"><div class="panel-header"><h3>⚙️ Settings</h3><button class="btn-close" onclick="toggleSettings()">✕</button></div>
            <div class="setting-item"><label>Dark Mode</label><label class="switch"><input type="checkbox" id="dark-mode-toggle" onchange="toggleDarkMode()"><span class="slider"></span></label></div>
            <div class="setting-item"><label>Theme</label><select id="theme-selector" onchange="changeTheme(this.value)"><option value="default">Default</option><option value="glassmorphism">Glassmorphism</option><option value="minimal-dark">Minimal Dark</option><option value="medical-blue">Medical Blue</option><option value="neon">Neon</option><option value="paper">Paper</option></select></div>
            <div class="setting-item"><label>Background Sound</label><select id="sound-selector" onchange="changeSound(this.value)"><option value="none">None</option><option value="fireplace">Fireplace</option><option value="forest">Forest</option></select></div>
            <div class="setting-item"><label>Volume</label><input type="range" id="volume-control" min="0" max="100" value="50" onchange="changeVolume(this.value)"></div>
            <div class="setting-item"><label>Animations</label><label class="switch"><input type="checkbox" id="animations-toggle" checked onchange="toggleAnimations()"><span class="slider"></span></label></div>
        </div>
    </div>

    <!-- SUBJECTS LIST -->
    <div id="subjects-screen" class="screen"><div class="screen-header"><button class="btn-back" onclick="goHome()">← Back</button><h3>Select Subject</h3></div><div id="subjects-list" class="selection-list"></div></div>

    <!-- DYNAMIC SELECTION (LECTURES / AI / YEARS) -->
    <div id="selection-screen" class="screen"><div class="screen-header"><button class="btn-back" onclick="goBackFromSelection()">← Back</button><h3 id="selection-title">Loading...</h3></div><div id="selection-search-container" class="hidden" style="margin-bottom:16px;"><input type="text" id="selection-search" placeholder="Filter groups..." oninput="filterSelectionList()" style="width:100%; padding:12px;"></div><div id="selection-list" class="selection-list"></div><div id="selection-footer" class="selection-footer hidden"><div class="footer-info"><p id="selected-count">0 selected</p></div><div class="question-count-control"><label>Questions:</label><input type="number" id="question-count-input" min="1" value="1"><span id="max-questions-label">/ 0</span></div><div class="mode-buttons"><button class="btn-mode" id="btn-training-mode" onclick="selectMode('training')">🎓 Training</button><button class="btn-mode" id="btn-exam-mode" onclick="selectMode('exam')">📝 Real Exam</button></div><div id="direction-selection" class="hidden"><div class="direction-buttons"><button class="btn-direction" id="btn-oneway" onclick="selectDirection('oneway')">→ One Way</button><button class="btn-direction" id="btn-twoway" onclick="selectDirection('twoway')">↔ Two Way</button></div></div><div id="timer-options" class="hidden"><p>Base: <span id="base-time-display"></span> | Total: <span id="total-time-display"></span></p><button class="btn-extra-time" onclick="addExtraTime()">+5 min extra</button></div><div id="start-section" class="hidden"><button class="btn-start" id="btn-start-exam" onclick="confirmStartExam()">🚀 Start Exam</button></div></div></div>

    <!-- EXAM, RESULTS, SEARCH, READONLY SCREENS -->
    <div id="exam-screen" class="screen"><div class="exam-header"><button class="btn-back" onclick="exitExam()">← Exit</button><div id="exam-timer" class="exam-timer hidden"></div><div id="exam-progress"></div></div><div id="question-grid" class="question-grid"></div><button class="btn-grid-toggle" id="btn-grid-toggle" onclick="toggleGrid()">☰ Hide Grid</button><div id="question-container"></div><div id="exam-nav"></div></div>
    <div id="results-screen" class="screen"><div class="screen-header"><button class="btn-back" onclick="goHome()">← Home</button><h3>Results</h3></div><div id="results-waiting" class="hidden"><div class="loading-spinner"></div><p id="waiting-message"></p></div><div id="results-content"></div><div id="results-review"></div></div>
    <div id="search-screen" class="screen"><div class="screen-header"><button class="btn-back" onclick="goHome()">← Back</button><h3>Search</h3></div><div class="search-container"><input type="text" id="search-input" placeholder="Search questions..." oninput="performSearch()"><select id="search-filter" onchange="performSearch()"></select></div><div id="search-results"></div></div>
    <div id="readonly-screen" class="screen"><div class="screen-header"><button class="btn-back" onclick="closeReadonly()">← Back</button><h3>Viewer</h3></div><div id="readonly-content"></div></div>
</div>
<div id="toast" class="toast hidden"></div>
<canvas id="fireworks-canvas" class="fireworks-canvas hidden"></canvas>
<audio id="bg-audio" loop></audio>
<script src="script.js"></script>
</body>
    </html>
